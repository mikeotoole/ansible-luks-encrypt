# Temporary trusted-branch bootstrap; remove after PR #1 lands on main.
name: Bootstrap CI

on:
  push:
    branches:
      - chore/open-source-readiness

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install checksum-verified uv 0.12.4
        run: |
          set -euo pipefail
          for tool in curl install mktemp sha256sum tar; do
            command -v "$tool" >/dev/null || {
              printf 'missing required tool: %s\n' "$tool" >&2
              exit 1
            }
          done
          UV_TMP="$(mktemp -d)"
          trap 'rm -rf "$UV_TMP"' EXIT
          UV_ARCHIVE="$UV_TMP/uv.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            'https://github.com/astral-sh/uv/releases/download/0.12.4/uv-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$UV_ARCHIVE"
          printf '%s  %s\n' \
            'c8c60f47e6f88d18dbf6f33d7279fb1fbf7ae76631768152cf5578c3d65729b4' \
            "$UV_ARCHIVE" | sha256sum --check --status
          tar -xzf "$UV_ARCHIVE" -C "$UV_TMP"
          test -f "$UV_TMP/uv-x86_64-unknown-linux-gnu/uv"
          test ! -L "$UV_TMP/uv-x86_64-unknown-linux-gnu/uv"
          install -d -m 0755 "$RUNNER_TEMP/bin"
          install -m 0755 "$UV_TMP/uv-x86_64-unknown-linux-gnu/uv" \
            "$RUNNER_TEMP/bin/uv"
          test "$("$RUNNER_TEMP/bin/uv" --version)" = 'uv 0.12.4'
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install managed Python 3.11
        run: |
          set -euo pipefail
          uv python install 3.11
          uv venv --python 3.11 --no-project .venv
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 11)'

      - name: Install pinned verification tools
        run: >-
          uv pip install --python .venv/bin/python --no-cache
          --require-hashes -r requirements-dev.txt

      - name: Run side-effect-free regression tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q scripts tests

      - name: Check Ansible syntax
        run: |
          .venv/bin/ansible-playbook --syntax-check prepare-usb.yml
          .venv/bin/ansible-playbook --syntax-check setup-encrypted-boot.yml

      - name: Lint Ansible content
        run: .venv/bin/ansible-lint
