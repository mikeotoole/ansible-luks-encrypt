name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Run side-effect-free regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check Ansible syntax
        run: |
          ansible-playbook --syntax-check prepare-usb.yml
          ansible-playbook --syntax-check setup-encrypted-boot.yml

      - name: Lint Ansible content
        run: ansible-lint
