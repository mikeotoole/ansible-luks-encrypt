# Pinned upstream USB builder checkout
asahi_usb_repo_path: "{{ lookup('env', 'HOME') }}/.local/share/asahi-fedora-usb"
asahi_usb_repo_url: https://github.com/leifliddy/asahi-fedora-usb.git
asahi_usb_repo_version: 575df59961e6e24dd7c6952de7d332353936af46

# Maximum accepted whole-disk USB size (GiB)
max_usb_size_gib: 256

# USB device for recovery drive (pass with -e usb_device=/dev/sda)
# usb_device: /dev/sda

# Internal NVMe device
nvme_device: /dev/nvme0n1

# LUKS device mapper name
luks_name: fedora-root

# Chroot mount point (used from USB boot)
chroot_mount: /mnt

# Project directory copied to the recovery image
project_dir: "{{ playbook_dir }}"
