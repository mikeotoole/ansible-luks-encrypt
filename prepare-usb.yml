---
# Prepare USB Recovery Drive for Fedora Asahi LUKS Encryption
#
# WARNING: The selected USB disk is erased by the pinned upstream builder.
#
# Usage:
#   ansible-playbook prepare-usb.yml --ask-become-pass
#   ansible-playbook prepare-usb.yml -e usb_device=/dev/sda --ask-become-pass
#
# Reference: https://davidalger.com/posts/fedora-asahi-remix-on-apple-silicon-with-luks-encryption/

- name: Prepare USB recovery drive
  hosts: localhost
  become: true
  gather_facts: false

  tasks:
    - name: List all block devices
      ansible.builtin.command:
        argv:
          - lsblk
          - --paths
          - --output
          - NAME,SIZE,TYPE,MODEL,TRAN,MOUNTPOINTS
      register: all_devices
      changed_when: false

    - name: Scan whole-disk USB candidates as JSON
      ansible.builtin.command:
        argv:
          - lsblk
          - --json
          - --bytes
          - --paths
          - --nodeps
          - --output
          - PATH,TYPE,TRAN,SIZE,MODEL,SERIAL
      register: usb_scan
      changed_when: false
      when: usb_device is not defined or usb_device | length == 0

    - name: Record whole-disk USB candidates
      ansible.builtin.set_fact:
        usb_candidates: >-
          {{
            (usb_scan.stdout | from_json).blockdevices
            | selectattr('type', 'equalto', 'disk')
            | selectattr('tran', 'equalto', 'usb')
            | map(attribute='path')
            | list
          }}
      when: usb_device is not defined or usb_device | length == 0

    - name: Fail if no USB devices were found
      ansible.builtin.fail:
        msg: |
          No whole-disk USB devices were detected. Plug in a USB drive and try again.

          {{ all_devices.stdout }}
      when:
        - usb_device is not defined or usb_device | length == 0
        - usb_candidates | default([]) | length == 0

    - name: Auto-select the only USB device
      ansible.builtin.set_fact:
        usb_device: "{{ usb_candidates[0] }}"
      when:
        - usb_device is not defined or usb_device | length == 0
        - usb_candidates | default([]) | length == 1

    - name: Prompt to choose from multiple USB devices
      ansible.builtin.pause:
        prompt: |
          Multiple whole-disk USB devices were found:
          {{ usb_candidates | join('\n') }}

          Enter the exact device path to use (for example, /dev/sda)
      register: multi_usb_choice
      when:
        - usb_device is not defined or usb_device | length == 0
        - usb_candidates | default([]) | length > 1

    - name: Record the selected USB device
      ansible.builtin.set_fact:
        usb_device: "{{ multi_usb_choice.user_input | trim }}"
      when:
        - multi_usb_choice is not skipped
        - multi_usb_choice.user_input is defined

    - name: Fail if no device was selected
      ansible.builtin.fail:
        msg: "No USB device selected. Pass -e usb_device=/dev/sda or plug in a USB drive."
      when: usb_device is not defined or usb_device | length == 0

    - name: Validate the selected device against live block topology
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/scripts/device_guard.py"
          - --device
          - "{{ usb_device }}"
          - --max-size-gib
          - "{{ max_usb_size_gib | string }}"
      register: device_guard
      changed_when: false

    - name: Record validated device details and stable identity
      ansible.builtin.set_fact:
        validated_device: "{{ device_guard.stdout | from_json }}"

    - name: Get selected device details for confirmation
      ansible.builtin.command:
        argv:
          - lsblk
          - --paths
          - --output
          - NAME,SIZE,MAJ:MIN,TYPE,FSTYPE,LABEL,MODEL,SERIAL,WWN,TRAN,MOUNTPOINTS
          - "{{ usb_device }}"
      register: device_info
      changed_when: false

    - name: Confirm exact device path before preparation
      ansible.builtin.pause:
        prompt: |
          ================================================================
           WARNING: THIS USB DEVICE IS THE CANDIDATE ERASE TARGET
          ================================================================

          {{ device_info.stdout }}

          Stable identity: {{ validated_device.identity | to_json }}
          Type the exact device path '{{ usb_device }}' to continue preparation
      register: initial_confirm

    - name: Abort unless the exact validated device path was entered
      ansible.builtin.fail:
        msg: "Aborted. The exact validated device path was not confirmed; no changes were made."
      when: initial_confirm.user_input | trim != usb_device

    - name: Install USB build dependencies
      ansible.builtin.dnf:
        name:
          - arch-install-scripts
          - bubblewrap
          - dosfstools
          - e2fsprogs
          - gdisk
          - git
          - mkosi
          - openssl
          - pandoc
          - rsync
          - systemd-container
        state: present

    - name: Check out the pinned asahi-fedora-usb object store
      ansible.builtin.git:
        repo: "{{ asahi_usb_repo_url }}"
        dest: "{{ asahi_usb_repo_path }}"
        version: "{{ asahi_usb_repo_version }}"
        update: true
        force: false
      become: false

    - name: Read the checked-out builder commit
      ansible.builtin.command:
        argv:
          - git
          - --no-replace-objects
          - -C
          - "{{ asahi_usb_repo_path }}"
          - rev-parse
          - HEAD
      become: false
      register: builder_head
      changed_when: false

    - name: Require the exact pinned builder commit
      ansible.builtin.assert:
        that:
          - builder_head.stdout | trim == asahi_usb_repo_version
        fail_msg: "The USB builder checkout does not match the reviewed pinned commit."

    - name: Create a fresh builder workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-luks-encrypt-builder.
      become: false
      register: builder_workspace

    - name: Build and populate the recovery USB from an exact export
      block:
        - name: Create the exact builder export directory
          ansible.builtin.file:
            path: "{{ builder_workspace.path }}/source"
            state: directory
            mode: "0755"
          become: false

        - name: Export the pinned tree with git archive
          ansible.builtin.command:
            argv:
              - git
              - --no-replace-objects
              - -C
              - "{{ asahi_usb_repo_path }}"
              - archive
              - --format=tar
              - "--output={{ builder_workspace.path }}/builder.tar"
              - "{{ asahi_usb_repo_version }}"
          become: false
          changed_when: true

        - name: Extract only tracked pinned builder bytes
          ansible.builtin.unarchive:
            src: "{{ builder_workspace.path }}/builder.tar"
            dest: "{{ builder_workspace.path }}/source"
            remote_src: true
          become: false

        - name: Remove the intermediate builder archive
          ansible.builtin.file:
            path: "{{ builder_workspace.path }}/builder.tar"
            state: absent
          become: false

        - name: Protect the complete builder workspace from substitution
          ansible.builtin.file:
            path: "{{ builder_workspace.path }}"
            owner: root
            group: root
            mode: a-w
            recurse: true

        - name: Verify every exported Git blob and executable mode after lockdown
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/scripts/verify_git_export.py"
              - --repo
              - "{{ asahi_usb_repo_path }}"
              - --commit
              - "{{ asahi_usb_repo_version }}"
              - --export
              - "{{ builder_workspace.path }}/source"
          changed_when: false

        - name: Require the exported builder entry point
          ansible.builtin.stat:
            path: "{{ builder_workspace.path }}/source/build.sh"
          register: exported_builder

        - name: Require an executable regular builder script
          ansible.builtin.assert:
            that:
              - exported_builder.stat.exists
              - exported_builder.stat.isreg
              - exported_builder.stat.executable
            fail_msg: "The pinned tree did not export an executable build.sh."

        - name: Confirm exact device path immediately before erasing
          ansible.builtin.pause:
            prompt: |
              ================================================================
               FINAL WARNING: ALL DATA ON THIS EXACT DEVICE WILL BE ERASED
              ================================================================

              {{ device_info.stdout }}

              The pinned builder is ready. Type the exact device path
              '{{ usb_device }}' again to revalidate its identity and erase it
          register: destructive_confirm

        - name: Abort unless the exact erase target was reconfirmed
          ansible.builtin.fail:
            msg: "Aborted at the final destructive boundary; the USB was not erased."
          when: destructive_confirm.user_input | trim != usb_device

        - name: Revalidate identity and execute the pinned builder without a gap
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/scripts/device_guard.py"
              - --device
              - "{{ usb_device }}"
              - --max-size-gib
              - "{{ max_usb_size_gib | string }}"
              - --expected-identity-json
              - "{{ validated_device.identity | to_json }}"
              - --exec
              - env
              - -u
              - SUDO_USER
              - ./build.sh
              - -d
              - "{{ usb_device }}"
            chdir: "{{ builder_workspace.path }}/source"
          changed_when: true

        - name: Revalidate identity and mount the exact USB
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/scripts/device_guard.py"
              - --device
              - "{{ usb_device }}"
              - --max-size-gib
              - "{{ max_usb_size_gib | string }}"
              - --expected-identity-json
              - "{{ validated_device.identity | to_json }}"
              - --exec
              - env
              - -u
              - SUDO_USER
              - ./build.sh
              - -d
              - "{{ usb_device }}"
              - mount
            chdir: "{{ builder_workspace.path }}/source"
          changed_when: true

        - name: Verify mounted USB targets belong to the confirmed device
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/scripts/device_guard.py"
              - --device
              - "{{ usb_device }}"
              - --max-size-gib
              - "{{ max_usb_size_gib | string }}"
              - --expected-identity-json
              - "{{ validated_device.identity | to_json }}"
              - --allow-mounted
              - --expected-mountpoint
              - "{{ builder_workspace.path }}/source/mnt_usb"
              - --expected-mountpoint
              - "{{ builder_workspace.path }}/source/mnt_usb/boot"
              - --expected-mountpoint
              - "{{ builder_workspace.path }}/source/mnt_usb/boot/efi"
          changed_when: false

        - name: Install ansible-core on the USB image
          ansible.builtin.command:
            argv:
              - arch-chroot
              - "{{ builder_workspace.path }}/source/mnt_usb"
              - dnf
              - install
              - -y
              - ansible-core
          changed_when: true

        - name: Copy this project to the USB image
          ansible.builtin.command:
            argv:
              - rsync
              - -a
              - --exclude
              - .git
              - --exclude
              - "*.retry"
              - "{{ project_dir }}/"
              - "{{ builder_workspace.path }}/source/mnt_usb/root/ansible-luks-encrypt/"
          changed_when: true
      always:
        - name: Unmount exported builder EFI target
          ansible.builtin.command:
            argv:
              - umount
              - --
              - "{{ builder_workspace.path }}/source/mnt_usb/boot/efi"
          register: builder_efi_cleanup
          changed_when: builder_efi_cleanup.rc == 0
          failed_when: false

        - name: Unmount exported builder boot target
          ansible.builtin.command:
            argv:
              - umount
              - --
              - "{{ builder_workspace.path }}/source/mnt_usb/boot"
          register: builder_boot_cleanup
          changed_when: builder_boot_cleanup.rc == 0
          failed_when: false

        - name: Unmount exported builder root target
          ansible.builtin.command:
            argv:
              - umount
              - --
              - "{{ builder_workspace.path }}/source/mnt_usb"
          register: builder_root_cleanup
          changed_when: builder_root_cleanup.rc == 0
          failed_when: false

        - name: Inspect every exported builder mount target
          ansible.builtin.command:
            argv:
              - findmnt
              - --mountpoint
              - "{{ item }}"
          loop:
            - "{{ builder_workspace.path }}/source/mnt_usb/boot/efi"
            - "{{ builder_workspace.path }}/source/mnt_usb/boot"
            - "{{ builder_workspace.path }}/source/mnt_usb"
          register: builder_mount_residue
          changed_when: false
          failed_when: false

        - name: Revalidate USB identity and mount state after cleanup
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/scripts/device_guard.py"
              - --device
              - "{{ usb_device }}"
              - --max-size-gib
              - "{{ max_usb_size_gib | string }}"
              - --expected-identity-json
              - "{{ validated_device.identity | to_json }}"
          register: usb_cleanup_guard
          changed_when: false
          failed_when: false

        - name: Remove workspace only after cleanup is proven
          ansible.builtin.file:
            path: "{{ builder_workspace.path }}"
            state: absent
          register: builder_workspace_cleanup
          failed_when: false
          when:
            - builder_mount_residue.results | selectattr('rc', 'equalto', 1) | list | length == 3
            - usb_cleanup_guard.rc == 0

        - name: Verify no USB mounts remain
          ansible.builtin.assert:
            that:
              - builder_mount_residue.results | selectattr('rc', 'equalto', 1) | list | length == 3
              - usb_cleanup_guard.rc == 0
              - builder_workspace_cleanup.state | default('') == 'absent'
            fail_msg: |
              USB cleanup is incomplete. The builder workspace was preserved at:
                {{ builder_workspace.path }}

              Inspect with findmnt before attempting manual cleanup.
              Device guard: {{ usb_cleanup_guard.stderr | default('not run') }}

    - name: Check for an existing host GRUB configuration
      ansible.builtin.stat:
        path: /boot/grub2/grub.cfg
      register: host_grub

    - name: Back up the host GRUB configuration once
      ansible.builtin.copy:
        src: /boot/grub2/grub.cfg
        dest: /boot/grub2/grub.cfg.ansible-luks-encrypt.bak
        remote_src: true
        force: false
        mode: preserve
      when: host_grub.stat.exists

    - name: Add USB boot entry to the internal GRUB menu
      ansible.builtin.command:
        argv:
          - grub2-mkconfig
          - -o
          - /boot/grub2/grub.cfg
      changed_when: true

    - name: Read generated host GRUB metadata
      ansible.builtin.stat:
        path: /boot/grub2/grub.cfg
      register: generated_host_grub

    - name: Require a nonempty generated host GRUB configuration
      ansible.builtin.assert:
        that:
          - generated_host_grub.stat.exists
          - generated_host_grub.stat.isreg
          - generated_host_grub.stat.size | int > 0
        fail_msg: "Host GRUB generation did not produce a nonempty regular file."

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          ================================================================
           USB RECOVERY DRIVE READY
          ================================================================

          USB identity and cleanup were verified. A non-overwriting backup of
          any previous host GRUB file is at:
            /boot/grub2/grub.cfg.ansible-luks-encrypt.bak

          NEXT STEPS:

          1. Reboot manually and select the USB entry from the GRUB menu.
             Login as root with the builder's documented recovery password.
             Change that known password or keep the recovery environment offline.

          2. Connect to Wi-Fi only if needed:
             nmcli dev wifi connect YOUR_SSID password YOUR_PASSWORD

          3. Identify the root partition:
             lsblk -f {{ nvme_device }}

          4. Back up data, verify the exact partition, and follow README.md's
             manual encryption procedure.

          5. Open the encrypted partition and run:
             cd /root/ansible-luks-encrypt
             ansible-playbook setup-encrypted-boot.yml

          6. Reboot manually and enter the LUKS passphrase at boot.

          ================================================================
